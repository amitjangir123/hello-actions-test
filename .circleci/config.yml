
version: 2.1

jobs:
  scan-songs:
    docker:
      - image: cimg/python:3.12

    resource_class: small

    steps:
      - checkout

      - run:
          name: Configure Git Authentication
          command: |
            set -eu

            if [ -z "${GH_PUSH_TOKEN:-}" ]; then
              echo "ERROR: GH_PUSH_TOKEN is missing"
              exit 1
            fi

            git config user.name "circleci-bot"
            git config user.email "circleci-bot@users.noreply.github.com"

            # Force HTTPS rather than SSH
            git config --global \
              url."https://github.com/".insteadOf \
              "git@github.com:"

            git remote set-url origin \
              https://github.com/amitjangir123/hello-actions-test.git

            # Authenticate using CircleCI secret
            git config --local credential.helper \
              '!f() { echo username=x-access-token; echo "password=$GH_PUSH_TOKEN"; }; f'

            echo "Git authentication configured"

      - run:
          name: Load Latest Main Branch
          command: |
            git fetch origin main
            git checkout -B music-scanner-work origin/main

      - run:
          name: Install Python Dependencies
          command: |
            python -m pip install beautifulsoup4

      - run:
          name: Run Song Scanner
          command: |
            python -u scan_songs.py

      - run:
          name: Commit and Push to Main
          when: always
          command: |
            set -eu

            git config user.name "circleci-bot"
            git config user.email "circleci-bot@users.noreply.github.com"

            git config --global \
              url."https://github.com/".insteadOf \
              "git@github.com:"

            git remote set-url origin \
              https://github.com/amitjangir123/hello-actions-test.git

            git config --local credential.helper \
              '!f() { echo username=x-access-token; echo "password=$GH_PUSH_TOKEN"; }; f'

            if [ -f songs.csv ]; then
              git add songs.csv
            fi

            if [ -f scan_state.json ]; then
              git add scan_state.json
            fi

            if ! git diff --cached --quiet; then
              git commit -m "[skip ci] Update songs database and scan state"

              git push \
                https://github.com/amitjangir123/hello-actions-test.git \
                HEAD:main

              echo "Successfully pushed database to main"
            else
              echo "No changes to commit"
            fi

workflows:
  scan-workflow:
    jobs:
      - scan-songs:
          filters:
            branches:
              only: circleci-project-setup
