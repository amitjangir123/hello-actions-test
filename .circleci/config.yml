
version: 2.1

jobs:
  scan-songs:
    docker:
      - image: cimg/python:3.12

    resource_class: small

    steps:
      - checkout

      - run:
          name: Configure Git Authentication
          command: |
            set -eu

            if [ -z "${GH_PUSH_TOKEN:-}" ]; then
              echo "ERROR: GH_PUSH_TOKEN is missing"
              exit 1
            fi

            git config user.name "circleci-bot"
            git config user.email "circleci-bot@users.noreply.github.com"

            # Remove SSH rewrite rules from all
            # writable Git configuration scopes.
            git config --global --remove-section \
              'url.git@github.com:' 2>/dev/null || true

            git config --local --remove-section \
              'url.git@github.com:' 2>/dev/null || true

            git remote set-url origin \
              https://github.com/amitjangir123/hello-actions-test.git

            echo "Git authentication configured"

      - run:
          name: Load Latest Main Branch
          command: |
            set -eu

            git -c url.git@github.com:.insteadOf= \
              fetch https://github.com/amitjangir123/hello-actions-test.git \
              main

            git checkout -B music-scanner-work FETCH_HEAD

      - run:
          name: Install Python Dependencies
          command: |
            python -m pip install beautifulsoup4

      - run:
          name: Run Song Scanner
          command: |
            python -u scan_songs.py

      - run:
          name: Commit and Push to Main
          when: always
          command: |
            set -eu

            if [ -z "${GH_PUSH_TOKEN:-}" ]; then
              echo "ERROR: GH_PUSH_TOKEN is missing"
              exit 1
            fi

            git config user.name "circleci-bot"
            git config user.email "circleci-bot@users.noreply.github.com"

            if [ -f songs.csv ]; then
              git add songs.csv
            fi

            if [ -f scan_state.json ]; then
              git add scan_state.json
            fi

            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "[skip ci] Update songs database and scan state"

            # Create HTTPS Basic authentication header
            # without printing the secret.
            AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\n')

            # Push with explicit HTTPS authentication.
            # Isolate Git configuration to prevent
            # inherited SSH URL rewrites.
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
              push https://github.com/amitjangir123/hello-actions-test.git \
              HEAD:main

            unset AUTH_HEADER

            echo "Successfully pushed database to main"

workflows:
  scan-workflow:
    jobs:
      - scan-songs:
          filters:
            branches:
              only: circleci-project-setup
