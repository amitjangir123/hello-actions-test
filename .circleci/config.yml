
version: 2.1

jobs:
  scan-songs:
    docker:
      - image: cimg/python:3.12

    resource_class: small

    steps:
      - checkout

      - run:
          name: Install Python dependencies
          command: pip install beautifulsoup4

      - run:
          name: Run song scanner
          command: python -u scan_songs.py

workflows:
  scan-workflow:
    jobs:
      - scan-songs
