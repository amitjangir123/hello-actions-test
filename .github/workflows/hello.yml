
name: Scan DjPunjab CSV

on:
  workflow_dispatch:
  schedule:
    - cron: "42 15 16 11 *"  

permissions:
  contents: write

concurrency:
  group: djpunjab-csv-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Scan Songs
        run: python -u scan_songs.py

      - name: Save CSV and Scan State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f songs.csv ]; then
            git add songs.csv
          fi

          if [ -f scan_state.json ]; then
            git add scan_state.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update song database and scan state"
            git push
          else
            echo "No changes to save."
          fi
